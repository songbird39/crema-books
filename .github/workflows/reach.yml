name: reach-test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: curl -s https://ipinfo.io/json
      - run: npm ci --omit=dev
      - run: node reach.js
